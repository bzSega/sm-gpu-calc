<header><p class="eyebrow">SM GPU CALC / INFERENCE LAB</p><h1 data-i18n="headline"></h1><p class="subtitle" data-i18n="subtitle"></p><nav class="topnav" aria-label="Language"><span class="badge" data-i18n="mode"></span><button id="lang-ru">RU</button><button id="lang-en">EN</button></nav></header>

<div class="control"><label data-i18n="workload"></label><div class="source-actions"><button id="demo" data-i18n="demo"></button><button id="manual" data-i18n="manual"></button><button id="choose-file">↑ CSV</button></div><small id="file-name"></small><input type="file" id="csv-file" accept=".csv,text/csv" hidden></div>
<div class="control"><label for="model" data-i18n="model"></label><select id="model"><option value="glm53">GLM-5.3 · 750 GB</option><option value="flash" selected>GLM-5.3-Flash · 320 GB</option><option value="qwenflash">Qwen3.8-Flash-Next · 125 GB</option></select><small data-i18n="modelHint"></small></div>
<div class="control"><label for="gpu" data-i18n="gpu"></label><select id="gpu"><option value="H200">H200 · 141 GB</option><option value="B200">B200 · 192 GB</option></select><small data-i18n="gpuHint"></small></div>
<div class="control"><label for="replicas" data-i18n="replicas"></label><input id="replicas" type="number" min="1" max="8" step="1" value="2"><small data-i18n="replicaHint"></small></div>
<div class="control"><button class="run" id="run" data-i18n="run"></button><div class="under-actions"><button class="textbutton" id="csv-help" data-i18n="format"></button><button class="textbutton" id="open-scenario" data-i18n="open"></button></div><input type="file" id="scenario-file" accept=".json,application/json" hidden></div>
</section>
<section class="assumptions" aria-label="Assumptions">
<div class="control"><label for="cards" data-i18n="cards"></label><input id="cards" type="number" min="1" max="16" step="1" value="8"></div>
<div class="control"><label for="prefill" data-i18n="prefillRate"></label><input id="prefill" type="number" min="0.01" max="1000000000" step="any" value="4000"></div>
<div class="control"><label for="decode" data-i18n="decodeRate"></label><input id="decode" type="number" min="0.01" max="1000000000" step="any" value="100"></div>
<div class="control"><label for="price" data-i18n="price"></label><input id="price" type="number" min="0" max="1000000" step="any" value="3"></div>
<div class="control"><label for="reserve" data-i18n="reserve"></label><input id="reserve" type="number" min="0" max="50" step="any" value="10"></div>
<button class="memory-note" id="memory-note"></button>
</section><section class="parallel" aria-label="Parallel requests"><div class="control"><label for="concurrency" data-i18n="concurrencyLabel"></label><input id="concurrency" type="number" min="1" max="256" step="1" value="8"><small data-i18n="concurrencyHint"></small></div><div class="control"><label for="batchGain" data-i18n="batchGainLabel"></label><input id="batchGain" type="number" min="0" max="100" step="any" value="50"><button type="button" class="textbutton" id="parallel-help" data-i18n="batchGainHint"></button></div><div class="capacity"><div><small data-i18n="memoryCapacity"></small><strong id="memory-slots"></strong><p class="detail" data-i18n="memoryCapacityHint"></p></div><div class="parallel-help"><small data-i18n="throughputEstimate"></small><strong id="capacity-rate"></strong><p class="detail" id="sharing-note"></p></div><div><small data-i18n="currentLimit"></small><strong id="current-limit"></strong><p class="detail" id="limit-detail"></p></div></div></section><p id="status" role="status" aria-live="polite"></p>
<section class="flow" aria-label="Request flow">
<article class="flow-side in"><p class="step">01 / INPUT</p><h2 data-i18n="load"></h2><div class="dots" id="input-dots" aria-hidden="true"></div><p class="val" id="arrived">—</p><small id="load-caption"></small></article><span class="arrow" aria-hidden="true">→</span>
<article class="flow-side queue"><p class="step">02 / FIFO</p><h2 data-i18n="queue"></h2><div class="dots" id="queue-dots" aria-hidden="true"></div><p class="val" id="queue-now">—</p><small data-i18n="queueNow"></small></article><span class="arrow" aria-hidden="true">→</span>
<div class="replica-section"><div class="replica-heading"><span data-i18n="pool"></span><span id="pool-count"></span></div><div id="replica-cards" class="replicas"></div></div><span class="arrow" aria-hidden="true">→</span>
<article class="flow-side out"><p class="step">04 / OUTPUT</p><h2 data-i18n="completed"></h2><p class="val" id="done-now">—</p><small data-i18n="completedNow"></small></article>
</section>
<section class="timeline"><button class="play" id="play"></button><div class="timeline-track"><div class="timeline-meta"><span data-i18n="timeline"></span><span id="timeline-end"></span></div><svg id="queue-chart" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path id="queue-path" fill="#f4c47b16" stroke="#f4c47b88" stroke-width="1.5"></path><line id="cursor" y1="0" y2="40" stroke="#a5ebd1" stroke-width="2"></line></svg><input id="time" type="range" min="0" max="1000" step="1" value="0" aria-label="Simulation time"></div><div class="timeline-right"><output id="time-label">0.00 s</output><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="5" selected>5×</option><option value="20">20×</option><option value="100">100×</option></select></div></section>
<section class="results"><article class="fact"><h2 data-i18n="duration"></h2><output class="total" id="duration">—</output><small data-i18n="fullRun"></small></article><article class="fact"><h2 data-i18n="peak"></h2><output class="total" id="peak">—</output><small data-i18n="requests"></small></article><article class="fact"><h2>TTFT p95</h2><output class="total" id="p95">—</output><small data-i18n="ttftHint"></small></article><article class="fact"><h2 data-i18n="totalCost"></h2><output class="total" id="total-cost">—</output><small data-i18n="rental"></small></article><article class="fact"><h2 data-i18n="costPer"></h2><output class="total" id="cost-per">—</output><small data-i18n="completedOnly"></small></article></section>

function settings(){return Object.fromEntries(settingsIds.map(k=>[k,['model','gpu'].includes(k)?$(k).value:($(k).value.trim()===''?NaN:Number($(k).value))]))}
function putSettings(s){s=S.normalizeSettings(s);for(const k of settingsIds)$(k).value=s[k]}

function stop(){playing=false;cancelAnimationFrame(raf);lastFrame=0}

function run(){stop();if(loading)return;const s=settings();result=null;runSettings=null;timeMs=0;try{if(!S.validateSettings(s))throw Error('configError');if(!S.memory(workload,s).fits)throw Error('noFit');result=SimCore.simulate(workload,S.config(s));runSettings={...s};status=source==='demo'?'demoStatus':'ready';buildChart()}catch(e){status=['noFit','configError'].includes(e.message)?e.message:'configError'}update()}
function buildChart(){if(!result)return;const events=[];for(const r of result.requests)if(r.startMs>r.arrival_ms)events.push([r.arrival_ms,1],[r.startMs,-1]);events.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let count=0,path='M0 38';for(let i=0;i<events.length;){const time=events[i][0],x=time/result.durationMs*1200;path+=` L${x} ${38-count/Math.max(1,result.peakQueued)*34}`;while(i<events.length&&events[i][0]===time)count+=events[i++][1];path+=` L${x} ${38-count/Math.max(1,result.peakQueued)*34}`}path+=' L1200 38 Z';$('queue-path').setAttribute('d',path)}

function renderCapacity(s,mem,snap){
 const n=mem?.effectiveSlots||0,gain=n?1+(n-1)*s.batchGain/100:0;

 $('sharing-note').textContent=n?`${n} → ${fmt(gain,2)}× ${t('aggregate')} · ${fmt(gain/n*100,1)}% ${t('perRequest')}`:'—';
 $('capacity-rate').parentElement.title=t('rateHelp');
 let limit='notCalculated',detail='';
 if(snap){
   limit='noQueue';detail=`${snap.active.length} ${t('activeRequests')}`;
   if(snap.queued){
     let spare=false;
     for(let i=1;i<=s.replicas;i++)if(snap.active.filter(r=>r.replica===i).length<s.concurrency)spare=true;
     limit=spare?'kvLimit':'slotLimit';detail=t(spare?'queueMemory':'queueSlots');
   }
 }
 $('current-limit').textContent=t(limit);$('limit-detail').textContent=detail;
}
