<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ИИ-стартап · Playground</title><link rel="stylesheet" href="game.css?v=ef12a05b7225efb6"></head><body>
<main id="game">
<div id="world"><svg id="scene" viewBox="0 0 1586 992" preserveAspectRatio="xMidYMid slice" aria-label="Серверная"></svg></div>
<header id="hud"><span class="brand">AI STARTUP</span><div class="clock"><strong id="clock">Подготовка</strong><span id="phase"></span></div><button id="fullscreen-toggle" type="button" aria-label="На весь экран" aria-pressed="false"><span aria-hidden="true">⛶</span><span class="fullscreen-label">На весь экран</span></button><button id="menu-toggle" type="button">Меню</button></header>
<section id="menu-screen" class="menu-card"><div class="mini">GPU CALC / PLAYGROUND</div><h1 id="game-title"></h1><p id="greeting"></p><button id="continue" class="primary" hidden></button><button id="new-game" class="primary"></button><button id="settings"></button><button id="learning-menu"></button><button id="sandbox-menu" class="quiet"></button><button id="load-menu" class="quiet"></button><small id="prototype"></small></section>
<aside id="tutorial" class="tip" hidden><span id="tip-tag"></span><h2 id="tip-title"></h2><p id="tip-body"></p><button id="lesson-open" type="button"></button></aside>
<div id="live-summary" class="live-summary" hidden><span id="arrivals"></span><button id="rps-button" type="button"><span id="rps-value"></span><small id="rps-window"></small></button><button id="queue-button"></button><span id="completed"></span></div>
<nav id="object-dock" aria-label="Объекты" hidden><button id="rack-dock"></button><button id="terminal-dock"></button><button id="visitors-dock"></button></nav>
<div id="notice" class="notice" role="status" hidden></div>
<dialog id="panel"><header><h2 id="panel-title"></h2><select id="panel-world" aria-label="Мир"><option value="server-room">Серверная</option><option value="workshop">Мастерская</option><option value="orbital">Станция</option></select><button id="close-panel" aria-label="Закрыть">×</button></header><div id="panel-body"></div></dialog>
<audio id="answer-correct" src="assets/answer-correct.wav" preload="auto" hidden></audio><audio id="answer-wrong" src="assets/answer-wrong.wav" preload="auto" hidden></audio>
<input id="save-input" type="file" accept="application/json,.json" hidden>
</main>
<script src="../sim-core.js?v=b930a94f7aebf27d"></script><script src="../scenario-core.js?v=0268438648eba15b"></script><script src="session.js?v=fe5fc490f97ae1ce"></script><script src="startup.js?v=0b623da0840f4548"></script><script src="clock.js?v=8ffe35dec9613f17"></script><script src="presentation.js?v=7090331a86d4b0a8"></script><script src="scene.js?v=6082749c20bc579b"></script><script src="lessons.js?v=8f26f26671437d7a"></script><script src="app.js?v=baa47b42f2bab60a"></script>
</body></html>
